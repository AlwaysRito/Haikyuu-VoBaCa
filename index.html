<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vobaca Proxies</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b2330;color:#fff;font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:420px;text-align:center}
  a{color:#ffb27d}
  small{color:#9aa5b4}
</style>
</head>
<body>
<main>
  <h1>Vobaca Proxies</h1>
  <p id="msg">Abriendo la última versión…</p>
  <p id="list"></p>
</main>
<script>
// Abre la versión más reciente de la herramienta que haya en el repositorio (vobaca-proxies-vX.Y.html).
// Así basta con subir el archivo nuevo: este enlace siempre lleva a la última versión.
(async () => {
  const hash = location.hash;   // conserva #vbimp=… (mazos enviados por el marcador)
  const go = f => location.replace(f + hash);
  const ver = f => (f.match(/v(\d+)\.(\d+)(?:\.(\d+))?\.html$/) || []).slice(1).map(x => +(x || 0));
  const newer = (a, b) => { const x = ver(a), y = ver(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
  let last = null;
  try { last = localStorage.getItem('vobaca-home-latest'); } catch (e) {}
  try {
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0] || owner + '.github.io';
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const files = (await r.json()).map(f => f.name).filter(n => /^vobaca-proxies-v[\d.]+\.html$/.test(n));
    if (!files.length) throw new Error('sin versiones');
    const best = files.reduce((a, b) => newer(b, a) ? b : a);
    try { localStorage.setItem('vobaca-home-latest', best); } catch (e) {}
    return go(best);
  } catch (e) {
    if (last) return go(last);
    document.getElementById('msg').textContent = 'No se ha podido comprobar cuál es la última versión. Sube un archivo vobaca-proxies-vX.Y.html a este repositorio o ábrelo directamente.';
  }
})();
</script>
</body>
</html>
