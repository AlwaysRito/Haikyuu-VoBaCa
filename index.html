<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly High VoBaCa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2330">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fly High VoBaCa">

<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b2330;color:#fff;font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:420px;text-align:center}
  a{color:#ffb27d}
  small{color:#9aa5b4}
</style>
</head>
<body>
<main>
  <h1>Fly High VoBaCa</h1>
  <p id="msg">Abriendo la última versión…</p>
  <p id="list"></p>
</main>
<script>
// Abre la versión más reciente de la herramienta que haya en el repositorio (fly-high-vobaca-vX.Y.html; si no hay, la antigua vobaca-proxies-vX.Y.html).
// Así basta con subir el archivo nuevo: este enlace siempre lleva a la última versión.
// Para poder instalarla como app (y abrirla sin conexión)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
// La web se ha mudado a Cloudflare: quien entre por la dirección antigua de GitHub va a la nueva (con el #… para no perder mazos ni marcador)
const NEW_HOME = 'https://fly-high-vobaca.haikyuu.workers.dev/';
if (location.hostname.endsWith('.github.io')) { document.getElementById('msg').textContent = 'La web se ha mudado. Abriendo la nueva dirección…'; location.replace(NEW_HOME + location.hash); }
else (async () => {
  const hash = location.hash;   // conserva #vbimp=… (mazos enviados por el marcador)
  const go = f => location.replace(f + hash);
  const ver = f => (f.match(/v(\d+)\.(\d+)(?:\.(\d+))?\.html$/) || []).slice(1).map(x => +(x || 0));
  const newer = (a, b) => { const x = ver(a), y = ver(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
  let last = null;
  try { last = localStorage.getItem('vobaca-home-latest'); } catch (e) {}
  try {
    // En github.io el usuario y el repositorio salen de la dirección; en otro dominio (Cloudflare, Netlify, dominio propio) se usan estos
    const REPO_OWNER = 'AlwaysRito', REPO_NAME = 'Haikyuu-VoBaCa';
    const onGh = location.hostname.endsWith('.github.io');
    const owner = onGh ? location.hostname.split('.')[0] : REPO_OWNER;
    const repo = onGh ? (location.pathname.split('/').filter(Boolean)[0] || owner + '.github.io') : REPO_NAME;
    // Si ya conocemos la última versión, no esperamos más de 1,5 s a GitHub (la propia herramienta avisa si hay otra nueva)
    const ctl = new AbortController(); const tm = last ? setTimeout(() => ctl.abort(), 1500) : null;
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, { cache: 'no-store', signal: ctl.signal }); if (tm) clearTimeout(tm);
    if (!r.ok) throw new Error(r.status);
    const all = (await r.json()).map(f => f.name), fh = all.filter(n => /^fly-high-vobaca-v[\d.]+\.html$/.test(n));
    const files = fh.length ? fh : all.filter(n => /^vobaca-proxies-v[\d.]+\.html$/.test(n));   // el nombre nuevo manda aunque su número sea menor
    if (!files.length) throw new Error('sin versiones');
    const best = files.reduce((a, b) => newer(b, a) ? b : a);
    try { localStorage.setItem('vobaca-home-latest', best); } catch (e) {}
    return go(best);
  } catch (e) {
    if (last) return go(last);
    document.getElementById('msg').textContent = 'No se ha podido comprobar cuál es la última versión. Sube un archivo fly-high-vobaca-vX.Y.html a este repositorio o ábrelo directamente.';
  }
})();
</script>
</body>
</html>
